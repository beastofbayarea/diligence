name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      USE_EDGAR: '1'
      SEC_USER_AGENT: 'beastofbayarea-diligence-ci/1.0 (contact: infra@beastofbayarea)'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Run extractor (step 1)
        run: |
          python run_pipeline.py --step 1 || echo "No PDFs or extractor failed"

      - name: Run verify+memo (steps 2+3)
        run: |
          # EDGAR-enabled verification (USE_EDGAR=1)
          python run_pipeline.py --step 2 || echo "verify skipped or failed"
          python run_pipeline.py --step 3 || echo "memo skipped or failed"

      - name: Run bench if available
        run: |
          if [ -d bench ]; then python bench.py bench || true; else echo "No bench folder"; fi
